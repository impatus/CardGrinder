name: Bug report
description: Report a CardGrinder problem
body:
  - type: markdown
    attributes:
      value: Never share passwords, QR sign-in links, Steam tokens, cookies or session.bin. Use private security reporting for sensitive issues.
  - type: input
    id: version
    attributes:
      label: CardGrinder version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps, expected behavior and the visible error message. Remove personal details from screenshots.
    validations:
      required: true
