name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore CardGrinder.sln --locked-mode
      - run: dotnet build CardGrinder.sln -c Release --no-restore -m:1
      - run: dotnet test tests/CardGrinder.Tests/CardGrinder.Tests.csproj -c Release --no-build --no-restore
      - name: Package matching version
        shell: pwsh
        run: ./scripts/build-release.ps1 -ExpectedVersion $env:RELEASE_TAG
      - name: Verify installer lifecycle
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; keeping its published assets unchanged.'
            exit 0
          }
          gh release create $env:RELEASE_TAG artifacts/release/CardGrinder-Setup.exe artifacts/release/CardGrinder-win-x64.zip artifacts/release/SHA256SUMS.txt --verify-tag --repo $env:GITHUB_REPOSITORY --title "CardGrinder $env:RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
